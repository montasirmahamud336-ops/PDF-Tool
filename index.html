<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PDFForge — Professional PDF Utility</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --radius:8px;--radius-l:14px;--radius-xl:20px;
  --transition:250ms cubic-bezier(.4,0,.2,1);
  --glow:0 0 24px rgba(59,130,246,0.12);
}
[data-theme="light"],:root{
  --bg:#f0f4f9;--surface:#fff;--surface2:#f6f8fc;
  --border:#e2e8f0;--border-s:#cbd5e1;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --primary:#1e40af;--primary-h:#1e3a8a;--primary-l:#eef2ff;
  --success:#16a34a;--error:#dc2626;--warn:#d97706;
  --shadow:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.03);
  --shadow-m:0 4px 16px rgba(0,0,0,0.06),0 2px 4px rgba(0,0,0,0.02);
  --shadow-l:0 8px 30px rgba(0,0,0,0.08);
  --nav-bg:rgba(255,255,255,0.82);
  --grad-1:linear-gradient(135deg,#1e40af,#6366f1);
  --grad-2:linear-gradient(135deg,#3b82f6,#a78bfa);
}
[data-theme="dark"]{
  --bg:#0b1120;--surface:#1a2332;--surface2:#1e293b;
  --border:#334155;--border-s:#475569;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --primary:#3b82f6;--primary-h:#60a5fa;--primary-l:#1e3a5f;
  --success:#22c55e;--error:#ef4444;--warn:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,0.25);
  --shadow-m:0 4px 16px rgba(0,0,0,0.3);
  --shadow-l:0 8px 32px rgba(0,0,0,0.35);
  --nav-bg:rgba(26,35,50,0.82);
  --grad-1:linear-gradient(135deg,#3b82f6,#818cf8);
  --grad-2:linear-gradient(135deg,#60a5fa,#a78bfa);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 20% 50%,rgba(59,130,246,0.08) 0%,transparent 70%),
             radial-gradient(ellipse at 80% 20%,rgba(99,102,241,0.05) 0%,transparent 60%),
             radial-gradient(ellipse at 50% 80%,rgba(59,130,246,0.04) 0%,transparent 60%);
  animation:bgShift 10s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{opacity:.5}100%{opacity:1}}

/* ── TOP NAV ── */
.top-nav{
  position:sticky;top:0;z-index:100;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:var(--nav-bg);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.top-nav .logo{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:17px;font-weight:700}
.top-nav .logo-badge{width:26px;height:26px;border-radius:7px;background:var(--grad-1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 2px 6px rgba(59,130,246,0.25)}
.top-nav .logo span{color:var(--primary);background:var(--grad-2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-nav-center{
  display:flex;align-items:center;gap:2px;padding:3px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--border);
}
.top-nav-center .tab-btn{
  padding:6px 12px;border-radius:7px;border:none;
  background:transparent;color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;transition:all var(--transition);font-family:var(--font);
  white-space:nowrap;
}
.top-nav-center .tab-btn:hover{color:var(--text)}
.top-nav-center .tab-btn.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}
.top-nav-right{display:flex;align-items:center;gap:6px}
.top-nav-right .theme-btn{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;
  font-family:var(--font);transition:all var(--transition);
}
.top-nav-right .theme-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:var(--glow)}
.top-nav-right .theme-btn svg{width:14px;height:14px}



/* ── HERO ── */
.hero{max-width:1040px;margin:0 auto;padding:44px 20px 32px;text-align:center;position:relative}
.hero-badge{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:16px;
  padding:5px 12px;border-radius:999px;background:var(--primary-l);
  border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--primary);
}
.hero::after{
  content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,0.06) 0%,transparent 65%);
  pointer-events:none;z-index:-1;
}
.hero h1{font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-0.7px;color:var(--text);line-height:1.2}
.hero h1 .gtext{background:var(--grad-2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--text2);font-size:13px;margin-top:6px;line-height:1.6;max-width:480px;margin-left:auto;margin-right:auto}

/* ── APP ── */
.app{max-width:1040px;margin:0 auto;padding:0 20px 48px}

/* ── TOOLS GRID ── */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tool-card{
  display:flex;align-items:flex-start;gap:14px;
  padding:18px;border-radius:var(--radius-xl);
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:all var(--transition);text-align:left;
  font-family:var(--font);color:var(--text);box-shadow:var(--shadow);
  outline:none;position:relative;overflow:hidden;
}
.tool-card::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:var(--grad-1);opacity:0;
  transition:opacity var(--transition);pointer-events:none;
  border-radius:0 3px 3px 0;
}
.tool-card:hover{
  border-color:var(--primary);box-shadow:var(--shadow-m),var(--glow);
  transform:translateY(-2px);padding-left:20px;
}
.tool-card:hover::before{opacity:1}
.tool-card:active{transform:translateY(0)}
.tool-card.active{border-color:var(--primary);background:var(--primary-l);box-shadow:var(--glow)}
.tool-icon{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;background:var(--surface2);color:var(--primary);
  border:1px solid var(--border);position:relative;z-index:1;
  transition:all var(--transition);
}
.tool-card:hover .tool-icon{background:var(--grad-1);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(59,130,246,0.2)}
.tool-name{font-size:14px;font-weight:600;margin-bottom:3px;position:relative;z-index:1;color:var(--text)}
.tool-desc{font-size:12px;color:var(--text3);line-height:1.4;position:relative;z-index:1}

/* ── WORKSPACE ── */
.workspace{display:none}
.workspace.show{display:block;animation:fadeIn .3s ease}
.ws-top{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;
}
.ws-top h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.ws-top h2 .ws-badge{
  display:inline-flex;width:30px;height:30px;border-radius:8px;
  background:var(--grad-1);color:#fff;font-size:12px;font-weight:700;
  align-items:center;justify-content:center;
}
.ws-back{
  padding:7px 16px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;font-family:var(--font);transition:all var(--transition);
}
.ws-back:hover{border-color:var(--primary);color:var(--primary);box-shadow:var(--glow);background:var(--primary-l)}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;box-shadow:var(--shadow-m)}
.card:hover{box-shadow:var(--shadow-l)}

/* ── DROPZONE ── */
.dropzone{
  border:2px dashed var(--border);border-radius:var(--radius-xl);
  padding:40px 20px;text-align:center;cursor:pointer;position:relative;
  transition:all var(--transition);background:var(--surface2);
}
.dropzone:hover,.dropzone.dragover{border-color:var(--primary);background:var(--primary-l);box-shadow:var(--glow)}
.dropzone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-icon{
  width:44px;height:44px;margin:0 auto 10px;border-radius:12px;
  background:var(--grad-1);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 4px 12px rgba(59,130,246,0.25);
}
.dropzone h3{font-size:15px;font-weight:600;margin-bottom:3px}
.dropzone p{font-size:13px;color:var(--text2)}
.browse-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  padding:8px 18px;border-radius:8px;background:var(--grad-1);color:#fff;
  font-size:12px;font-weight:600;border:none;cursor:pointer;
  font-family:var(--font);transition:all var(--transition);position:relative;z-index:2;
  box-shadow:0 2px 8px rgba(59,130,246,0.25);
}
.browse-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(59,130,246,0.35)}

/* ── FILE LIST ── */
.file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:16px}
.file-item{border-radius:var(--radius-l);overflow:hidden;border:1px solid var(--border);background:var(--surface2);display:flex;flex-direction:column;transition:all var(--transition)}
.file-item:hover{box-shadow:var(--shadow-m)}
.file-thumb{height:90px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-chip{position:absolute;top:5px;left:5px;font-size:8px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,0.55);color:#fff;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(4px)}
.file-ico{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2)}
.file-body{padding:10px 12px}
.file-n{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-s{font-size:10px;color:var(--text3);margin-top:2px}
.file-act{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
.btn-xi{padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:10px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all var(--transition)}
.btn-xi:hover{border-color:var(--primary);color:var(--primary)}
.btn-xi.dng:hover{border-color:var(--error);color:var(--error);background:rgba(220,38,38,0.04)}
.empty-state{grid-column:1/-1;padding:20px;text-align:center;color:var(--text3);font-size:12px;background:var(--surface);border-radius:var(--radius-l);border:1px solid var(--border)}

/* ── CONFIG ── */
.cfg{display:none;margin-top:14px}
.cfg.show{display:block}
.cfg-box{padding:18px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface2)}
.cfg label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px}
.cfg input,.cfg select{
  width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-family:var(--font);
  font-size:13px;outline:none;transition:border var(--transition);
}
.cfg input:focus,.cfg select:focus{border-color:var(--primary)}
.cfg-hint{font-size:11px;color:var(--text3);margin-top:3px}
.cfg-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.cfg-r label{margin-bottom:0;text-transform:none;letter-spacing:0}

/* ── PROGRESS ── */
.prg{display:none;margin-top:16px}
.prg.show{display:block;animation:fadeIn .2s ease}
.prg-i{padding:16px 18px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface2)}
.prg-l{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600}
.prg-b{border-radius:999px;height:6px;overflow:hidden;background:var(--border)}
.prg-f{height:100%;border-radius:999px;background:var(--grad-1);width:0%;transition:width .4s ease;box-shadow:0 0 8px rgba(59,130,246,0.3)}

/* ── DOWNLOAD ── */
.dl{display:none;margin-top:16px;padding:18px 20px;border-radius:var(--radius-l);border:1px solid var(--success);background:rgba(22,163,74,0.04)}
.dl.show{display:block;animation:fadeIn .2s ease}
.dl-t{color:var(--success);font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dl-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dl-r input{flex:1;min-width:180px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border var(--transition)}
.dl-r input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.btn-dl{padding:8px 18px;border-radius:8px;background:var(--success);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all var(--transition)}
.btn-dl:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 2px 8px rgba(22,163,74,0.3)}

/* ── ACTIONS ── */
.act{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-p{
  flex:1;padding:11px 24px;border-radius:8px;background:var(--grad-1);
  border:none;color:#fff;font-family:var(--font);font-size:13px;font-weight:600;
  cursor:pointer;transition:all var(--transition);box-shadow:0 2px 8px rgba(59,130,246,0.25);
}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(59,130,246,0.35)}
.btn-p:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-g{
  padding:11px 20px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:500;
  cursor:pointer;transition:all var(--transition);
}
.btn-g:hover{border-color:var(--primary);color:var(--primary);box-shadow:var(--glow)}

/* ── TOAST ── */
.tst{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.t{
  padding:12px 16px;border-radius:var(--radius-l);background:var(--surface);
  border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;
  box-shadow:var(--shadow-l);
  transform:translateY(12px);opacity:0;transition:all .3s ease;max-width:340px;
  backdrop-filter:blur(8px);
}
.t.show{transform:translateY(0);opacity:1}
.t.g{border-color:var(--success);color:var(--success)}
.t.r{border-color:var(--error);color:var(--error)}
.t.w{border-color:var(--warn);color:var(--warn)}

/* ── IMG GRID ── */
.img-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.img-c{border-radius:var(--radius-l);overflow:hidden;border:1px solid var(--border);background:var(--surface2);position:relative;transition:all var(--transition)}
.img-c:hover{box-shadow:var(--shadow-m)}
.img-c img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
.img-l{position:absolute;left:5px;right:5px;bottom:5px;border-radius:6px;padding:7px;background:rgba(15,23,42,0.85);color:#fff;font-size:10px;font-weight:600;text-align:center;cursor:pointer;backdrop-filter:blur(4px);transition:all var(--transition)}
.img-l:hover{background:var(--primary)}

.txt-box{display:none;margin-top:14px}
.txt-box.show{display:block;animation:fadeIn .2s ease}
.txt-box textarea{width:100%;min-height:260px;max-height:480px;padding:14px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Courier New',monospace;font-size:12px;line-height:1.5;resize:vertical;outline:none;transition:border var(--transition)}
.txt-box textarea:focus{border-color:var(--primary)}
.txt-box .txt-stat{display:flex;gap:12px;font-size:11px;color:var(--text3);margin-top:6px;flex-wrap:wrap}
.txt-box .txt-stat span{background:var(--surface);padding:3px 8px;border-radius:5px;border:1px solid var(--border)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:700px){
  .top-nav{padding:0 12px;height:54px}
  .top-nav-center .tab-btn{padding:5px 8px;font-size:11px}
  .top-nav-center{gap:1px;padding:2px}
  .top-nav-right .theme-btn{padding:5px 8px;font-size:10px}
  .app{padding:0 14px 32px}
  .tools-grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:20px}
}
@media(max-width:450px){
  .tools-grid{grid-template-columns:1fr}
  .file-list{grid-template-columns:1fr}
  .hero::after{display:none}
  .top-nav-center{gap:0;padding:2px}
  .top-nav-center .tab-btn{padding:4px 7px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- Top Nav -->
<div class="top-nav">
  <div class="logo" onclick="closeWorkspace()">
    <div class="logo-badge">F</div>
    PDF<span>Forge</span>
  </div>
  <div class="top-nav-center">
    <button class="tab-btn active" data-tab="all">All</button>
    <button class="tab-btn" data-tab="merge">Merge &amp; Organize</button>
    <button class="tab-btn" data-tab="convert">Convert &amp; Optimize</button>
    <button class="tab-btn" data-tab="secure">Security &amp; Sign</button>
  </div>
  <div class="top-nav-right">
    <button class="theme-btn" onclick="toggleTheme()">
      <svg id="navThemeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span id="navThemeLabel">Dark</span>
    </button>
  </div>
</div>

<div class="hero">
  <div class="hero-badge">&#9889; All PDF tools in one place</div>
  <h1>Professional <span class="gtext">PDF Forge</span></h1>
  <p>Merge, split, convert, edit, secure &mdash; every PDF workflow, powered locally.</p>
</div>

<div class="app">

  <div id="toolsGrid" class="tools-grid"></div>

  <div class="workspace" id="workspace">
    <div class="ws-top">
      <h2><span id="wsIcon" style="width:30px;height:30px;border-radius:7px;background:var(--primary-l);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">M</span><span id="wsTitle">Tool</span></h2>
      <button class="ws-back" onclick="closeWorkspace()">&larr; All Tools</button>
    </div>
    <div class="card">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" />
        <div class="dz-icon">&#8682;</div>
        <h3>Drop files here</h3>
        <p>or click Browse to select files</p>
        <button class="browse-btn" type="button" onclick="document.getElementById('fileInput').click()">Browse Files</button>
      </div>
      <div class="file-list" id="fileList"></div>
      <div class="cfg" id="cfgPanel"><div class="cfg-box" id="cfgInner"></div></div>
      <div class="prg" id="prgWrap"><div class="prg-i">
        <div class="prg-l"><span id="prgLabel">Processing...</span><span id="prgPct">0%</span></div>
        <div class="prg-b"><div class="prg-f" id="prgBar"></div></div>
      </div></div>
      <div class="dl" id="dlBox">
        <div class="dl-t">&#10003; File ready</div>
        <div class="dl-r">
          <input type="text" id="outName" placeholder="output-filename" />
          <button class="btn-dl" id="dlBtn" onclick="downloadOut()">Download</button>
        </div>
      </div>
      <div class="txt-box" id="txtBox">

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const API=window.location.origin;

/* ── TOOL DEFINITIONS ── */

/* ── TOOL CONFIG ── */

let curTab='all',curTool=null,files=[],outUrl=null,cmpFile=null,imgRes=[],totPages=0;

/* ── RENDER ── */
function render(){
  const g=document.getElementById('toolsGrid');g.innerHTML='';
  const items=TOOLS.filter(t=>curTab==='all'||t.cat===curTab);
  items.forEach(t=>{
    const c=document.createElement('button');c.className='tool-card';c.type='button';
    c.innerHTML=`<div class="tool-icon">${t.icon}</div><div><div class="tool-name">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`;
    c.onclick=()=>openTool(t.id);g.appendChild(c);
  });
}

/* ── TABS ── */
document.querySelectorAll('.top-nav-center .tab-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.top-nav-center .tab-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    curTab=this.dataset.tab;
    render();
  });
});

/* ── OPEN TOOL ── */
function openTool(id){
  curTool=id;clearWS();
  const c=CFG[id];if(!c)return;
  const info=TOOLS.find(t=>t.id===id);
  document.getElementById('wsIcon').textContent=info?.icon||'T';
  document.getElementById('wsTitle').textContent=info?.name||id;

  const dz=document.getElementById('dropzone');
  dz.querySelector('h3').textContent=c.multi?'Drop your files here':'Drop a file here';
  dz.querySelector('p').textContent=c.multi?'or click Browse to select files':'or click Browse to select';

  const inp=document.getElementById('fileInput');
  inp.accept=c.accept||'.pdf';inp.multiple=!!c.multi;inp.value='';
  inp.onchange=()=>{const f=Array.from(inp.files);files=c.multi?f:[f[0]];renderFiles();if(files.length&&c.cfg==='split')countPages()};

  const ci=document.getElementById('cfgInner');ci.innerHTML='';
  document.getElementById('cfgPanel').classList.remove('show');
  if(c.cfg||c.pages||c.extra){
    ci.innerHTML=confHTML(c);document.getElementById('cfgPanel').classList.add('show');
  }
  if(['merge','scan','image_to_pdf','html_to_pdf','merge_image','jpg_to_pdf','convert_to_pdf','convert_from_pdf','pdf_info','pdf_to_jpg'].includes(id))document.getElementById('cfgPanel').classList.remove('show');

  document.querySelector('.top-nav-center').style.display='none';
  document.querySelector('.hero').style.display='none';
  document.getElementById('toolsGrid').style.display='none';
  document.getElementById('workspace').classList.add('show');
}

function confHTML(c){
  let h='';
  if(c.pages)h+=`<label>${c.pages.label||'Pages:'}</label><input id="cPages" placeholder="e.g. 1,3-5" /><div class="cfg-hint">${c.pages.req?'Required.':'Leave empty for all pages.'}</div>`;
  const cfg=c.cfg;
  if(cfg==='protect')h+=`<label>Password</label><input type="password" id="cPw" placeholder="Enter password" /><div class="cfg-hint">Password to protect PDF.</div>`;
  if(cfg==='unlock')h+=`<label>Current Password</label><input type="password" id="cPw" placeholder="Enter password" /><div class="cfg-hint">Password to unlock PDF.</div>`;
  if(cfg==='sign')h+=`<label>Signature</label><input id="cSign" placeholder="Your name" />`;
  if(cfg==='redact')h+=`<label>Text to Redact</label><input id="cRedact" placeholder="Sensitive text" />`;
  if(cfg==='translate')h+=`<label>Language Code</label><input id="cLang" value="en" placeholder="e.g. es, fr, bn" /><div class="cfg-hint">Target language code.</div>`;
  if(cfg==='compare')h+=`<label>Second PDF</label><input type="file" id="cCmp" accept=".pdf" /><div class="cfg-hint">Upload PDF to compare.</div>`;
  if(cfg==='summary')h+=`<label>Sentences</label><input type="number" id="cSent" min="3" max="12" value="5" style="width:90px" /><div class="cfg-hint">Summary sentence count (3-12).</div>`;
  if(cfg==='split')h+=`<label>Split After Page</label><div class="cfg-r"><input type="number" id="cSp" min="1" value="1" style="width:90px" /><span class="cfg-hint" id="spHint">Upload to see page count.</span></div>`;
  if(cfg==='img')h+=`<label>Format</label><select id="cFmt"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WebP</option></select><div class="cfg-r"><label style="text-transform:none">DPI</label><input type="range" id="cDpi" min="72" max="600" step="24" value="300" oninput="document.getElementById('dv').textContent=this.value" style="flex:1" /><span id="dv" style="font-weight:600;color:var(--primary);min-width:35px;text-align:right">300</span></div><div class="cfg-r"><label style="text-transform:none">Pages</label><input type="number" id="cPf" placeholder="From" min="1" style="width:65px" /><span style="color:var(--text3)">to</span><input type="number" id="cPt" placeholder="To" min="1" style="width:65px" /></div><div class="cfg-hint">Leave empty for all pages.</div>`;
  if(cfg==='pn')h+=`<label>Start Number</label><div class="cfg-r"><input type="number" id="cPs" value="1" min="1" style="width:80px" /><label style="text-transform:none">Position</label><select id="cPp"><option value="bottom-right">Bottom Right</option><option value="bottom-center">Bottom Center</option><option value="bottom-left">Bottom Left</option><option value="top-right">Top Right</option><option value="top-center">Top Center</option><option value="top-left">Top Left</option></select></div>`;
  if(cfg==='wm')h+=`<label>Type</label><div class="cfg-r"><label style="text-transform:none"><input type="radio" name="wm" value="text" checked onchange="wmUI()" /> Text</label><label style="text-transform:none"><input type="radio" name="wm" value="image" onchange="wmUI()" /> Image</label></div><div id="wmT"><label>Text</label><input id="cWmT" placeholder="CONFIDENTIAL" /><div class="cfg-r"><input type="number" id="cWmO" value="0.2" min="0.05" max="1" step="0.05" style="width:80px" placeholder="Opacity" /><input type="number" id="cWmA" value="35" style="width:80px" placeholder="Angle" /></div></div><div id="wmI" style="display:none"><label>Logo</label><input type="file" id="cLogo" accept="image/*" /><div class="cfg-r"><input type="number" id="cLs" value="0.2" min="0.05" max="0.6" step="0.05" style="width:70px" placeholder="Scale" /><input type="number" id="cLo" value="0.8" min="0.1" max="1" step="0.05" style="width:70px" placeholder="Opacity" /></div><div class="cfg-r"><select id="cLp"><option value="bottom-right">Bottom Right</option><option value="bottom-left">Bottom Left</option><option value="top-right">Top Right</option><option value="top-left">Top Left</option><option value="center">Center</option></select><input type="number" id="cLr" value="0" style="width:70px" placeholder="Rotate" /></div></div>`;
  if(c.extra==='rotate')h+=`<label>Rotation</label><select id="cEx"><option value="90">90&#176; CW</option><option value="180">180&#176;</option><option value="270">270&#176; CW</option><option value="-90">90&#176; CCW</option></select>`;
  if(c.extra==='crop')h+=`<label>Crop Margins (%)</label><div class="cfg-r"><input type="number" id="cCl" min="0" max="40" value="0" style="width:55px" placeholder="L" /><input type="number" id="cCr" min="0" max="40" value="0" style="width:55px" placeholder="R" /><input type="number" id="cCt" min="0" max="40" value="0" style="width:55px" placeholder="T" /><input type="number" id="cCb" min="0" max="40" value="0" style="width:55px" placeholder="B" /></div><div class="cfg-hint">Percentage of page width/height.</div>`;
  return h;
}

function wmUI(){const v=document.querySelector('input[name="wm"]:checked')?.value;document.getElementById('wmT').style.display=v==='text'?'block':'none';document.getElementById('wmI').style.display=v==='image'?'block':'none'}

/* ── FILES ── */
function renderFiles(){
  const l=document.getElementById('fileList');l.innerHTML='';
  if(!files.length){l.innerHTML='<div class="empty-state">No files selected.</div>';return}
  files.forEach((f,i)=>{
    const e=(f.name.split('.').pop()||'').toUpperCase(),isImg=['PNG','JPG','JPEG','WEBP'].includes(e);
    const ic=e==='PDF'?'<span class="file-ico">PDF</span>':isImg?`<img src="${URL.createObjectURL(f)}" />`:`<span class="file-ico">${e}</span>`;
    const it=document.createElement('div');it.className='file-item';
    it.innerHTML=`<div class="file-thumb"><span class="file-chip">${e}</span>${ic}</div><div class="file-body"><div class="file-n">${f.name}</div><div class="file-s">${fs(f.size)}</div><div class="file-act"><button class="btn-xi dng" onclick="rmFile(${i})">Remove</button></div></div>`;
    l.appendChild(it);
  });
}
function rmFile(i){files.splice(i,1);renderFiles()}

async function countPages(){
  if(!files[0])return;
  try{
    const fd=new FormData();fd.append('file',files[0]);
    const r=await fetch(API+'/pdf-info',{method:'POST',body:fd});
    if(!r.ok)return;
    const d=await r.json();totPages=Number(d.pages)||0;
    if(totPages>1){document.getElementById('spHint').textContent=totPages+' pages. Split at: 1-'+(totPages-1);document.getElementById('cSp').max=totPages-1}
  }catch(e){}
}

/* ── WORKSPACE ── */
function closeWorkspace(){
  document.getElementById('workspace').classList.remove('show');
  document.querySelector('.top-nav-center').style.display='flex';
  document.querySelector('.hero').style.display='block';
  document.getElementById('toolsGrid').style.display='grid';
  clearWS();
}
function clearWS(){
  files=[];outUrl=null;cmpFile=null;imgRes=[];
  document.getElementById('fileList').innerHTML='';
  document.getElementById('cfgPanel').classList.remove('show');
  document.getElementById('cfgInner').innerHTML='';
  document.getElementById('prgWrap').classList.remove('show');
  document.getElementById('dlBox').classList.remove('show');
  document.getElementById('fileInput').value='';
  document.getElementById('txtBox').classList.remove('show');
  document.getElementById('txtArea').value='';
}

/* ── RUN ── */
async function runTool(){
  const id=curTool,c=CFG[id];
  if(!c||!files.length){toast('Please add files first.','r');return}
  const pw=document.getElementById('prgWrap'),pb=document.getElementById('prgBar'),pp=document.getElementById('prgPct');
  pw.classList.add('show');pb.style.width='0%';pp.textContent='0%';
  document.getElementById('dlBox').classList.remove('show');
  const btn=document.getElementById('actBtn');btn.disabled=true;btn.textContent='Processing...';

  let ep=c.ep;const fd=new FormData();
  try{
    if(['merge','scan','image_to_pdf','html_to_pdf','merge_image','jpg_to_pdf','convert_to_pdf'].includes(id)){files.forEach(f=>fd.append('files',f))}
    else if(id==='split'){
      fd.append('file',files[0]);const p=parseInt(document.getElementById('cSp')?.value)||1;fd.append('page',p);
    }else if(id==='compare'){
      fd.append('file',files[0]);const f2=document.getElementById('cCmp')?.files[0];if(!f2)throw Error('Upload second PDF.');fd.append('file2',f2);
    }else{
      fd.append('file',files[0]);
      if(c.pages){const p=document.getElementById('cPages')?.value;if(c.pages.req&&!p)throw Error('Pages required.');if(p)fd.append('pages',p)}
      if(id==='rotate')fd.append('degrees',document.getElementById('cEx')?.value||'90');
      if(id==='crop'){fd.append('left',document.getElementById('cCl')?.value||'0');fd.append('right',document.getElementById('cCr')?.value||'0');fd.append('top',document.getElementById('cCt')?.value||'0');fd.append('bottom',document.getElementById('cCb')?.value||'0')}
      if(id==='protect'||id==='unlock'){const p=document.getElementById('cPw')?.value;if(!p)throw Error('Password required.');fd.append('password',p)}
      if(id==='sign'){const s=document.getElementById('cSign')?.value;if(!s)throw Error('Name required.');fd.append('text',s)}
      if(id==='redact'){const r=document.getElementById('cRedact')?.value;if(!r)throw Error('Text required.');fd.append('text',r)}
      if(id==='translate')fd.append('lang',document.getElementById('cLang')?.value||'en');
      if(id==='page_numbers'){fd.append('start',document.getElementById('cPs')?.value||'1');fd.append('position',document.getElementById('cPp')?.value||'bottom-right')}
      if(id==='summary')fd.append('sentences',document.getElementById('cSent')?.value||'5');
      if(id==='watermark'){
        if(document.querySelector('input[name="wm"]:checked')?.value==='image'){
          ep='add-logo';const l=document.getElementById('cLogo');if(!l?.files[0])throw Error('Upload logo.');
          fd.append('logo',l.files[0]);fd.append('scale',document.getElementById('cLs')?.value||'0.2');fd.append('opacity',document.getElementById('cLo')?.value||'0.8');fd.append('position',document.getElementById('cLp')?.value||'bottom-right');fd.append('rotate',document.getElementById('cLr')?.value||'0');
        }else{const t=document.getElementById('cWmT')?.value;if(!t)throw Error('Text required.');fd.append('text',t);fd.append('opacity',document.getElementById('cWmO')?.value||'0.2');fd.append('angle',document.getElementById('cWmA')?.value||'35')}
        const p=document.getElementById('cPages')?.value;if(p)fd.append('pages',p);
      }
    }

    let p=0,anim=setInterval(()=>{if(p<90){p+=Math.random()*8;if(p>90)p=90;pb.style.width=p+'%';pp.textContent=Math.round(p)+'%'}},400);

    if(id==='split'){
      const pg=parseInt(document.getElementById('cSp')?.value)||1;
      const f1=new FormData();f1.append('file',files[0]);f1.append('page',pg);
      const r1=await fetch(API+'/split',{method:'POST',body:f1});
      if(!r1.ok)throw Error('Split failed');
      const f2=new FormData();f2.append('file',files[0]);f2.append('page',pg);
      const r2=await fetch(API+'/split/part2',{method:'POST',body:f2});
      if(!r2.ok)throw Error('Split part 2 failed');
      outUrl=URL.createObjectURL(new Blob([await r1.blob(),await r2.blob()],{type:'application/zip'}));
      setupDL(id,(files[0].name.replace(/\.[^.]+$/,'')||'split')+'-parts','zip');
    }else if(id==='pdf_to_image'||id==='pdf_to_jpg'){
      if(id==='pdf_to_jpg')fd.append('format','jpg');
      const r=await fetch(API+'/'+ep,{method:'POST',body:fd});
      if(!r.ok)throw Error('Conversion failed');
      const d=await r.json(),fmt=d.format||'png',mime=fmt==='jpeg'||fmt==='jpg'?'image/jpeg':fmt==='webp'?'image/webp':'image/png',off=Number(d.page_from||1);
      imgRes=d.images.map((b,i)=>({pn:off+i,ext:fmt,url:'data:'+mime+';base64,'+b}));
      showImgs();clearInterval(anim);pb.style.width='100%';pp.textContent='100%';
      btn.disabled=false;btn.textContent='Run';toast(d.images.length+' page(s) converted');return;
    }else if(id==='pdf_to_text'){
      const r=await fetch(API+'/'+ep,{method:'POST',body:fd});
      if(!r.ok){let m='Failed.';try{const e=await r.json();m=e.detail||m}catch(e){}throw Error(m)}
      const txt=await r.text(),h=r.headers;
      const pages=h.get('x-total-pages')||'?',ocr=h.get('x-ocr-used')||'false';
      const ta=document.getElementById('txtArea');ta.value=txt;
      document.getElementById('txtChars').textContent=txt.length+' characters';
      document.getElementById('txtWords').textContent=(txt.match(/\S+/g)||[]).length+' words';
      document.getElementById('txtPages').textContent=pages+' pages';
      document.getElementById('txtOcr').textContent=ocr==='true'?'OCR used':'Digital text';
      document.getElementById('txtBox').classList.add('show');
      outUrl=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));setupDL(id);
      clearInterval(anim);pb.style.width='100%';pp.textContent='100%';
      btn.disabled=false;btn.textContent='Run';toast('Text extracted.','g');
      return;
    }else{
      if(id==='pdf_info'){
        const r=await fetch(API+'/'+ep,{method:'POST',body:fd});
        if(!r.ok)throw Error('Failed');
        const d=await r.json(),lines=Object.entries(d||{}).map(([k,v])=>k+': '+v).join('\n');
        showImgs();clearInterval(anim);pb.style.width='100%';pp.textContent='100%';
        btn.disabled=false;btn.textContent='Run';toast(lines||'PDF info retrieved.','g');return;
      }
      const r=await fetch(API+'/'+ep,{method:'POST',body:fd});
      if(!r.ok){let m='Failed.';try{const e=await r.json();m=e.detail||m}catch(e){}throw Error(m)}
      outUrl=URL.createObjectURL(await r.blob());setupDL(id);
    }
    clearInterval(anim);pb.style.width='100%';pp.textContent='100%';toast('File ready.');
  }catch(e){pw.classList.remove('show');toast(e.message||'Error. Is the backend running?','r')}
  btn.disabled=false;btn.textContent='Run';
}

function setupDL(id,def,ext){
  const c=CFG[id];const db=document.getElementById('dlBox');db.classList.add('show');
  document.getElementById('outName').value=def||((files[0]?.name||'output').replace(/\.[^.]+$/,'')+'-'+id);
  const e=ext||c?.ext||'pdf';document.getElementById('dlBtn').textContent='Download '+e.toUpperCase();db.dataset.ext=e;
}
function downloadOut(){
  if(!outUrl){toast('Run a tool first.','r');return}
  const n=document.getElementById('outName').value||'output',e=document.getElementById('dlBox').dataset.ext||'pdf';
  const a=document.createElement('a');a.href=outUrl;a.download=n.replace(/[<>:"/\\|?*\x00-\x1F]/g,'')+'.'+e;
  document.body.appendChild(a);a.click();a.remove();toast('Download started.');
}
function showImgs(){
  const db=document.getElementById('dlBox');db.classList.add('show');
  document.getElementById('outName').value='pdf-page';db.dataset.ext='zip';
  document.getElementById('dlBtn').textContent='Download ZIP';document.getElementById('dlBtn').onclick=dlZip;
  let h='<div class="img-g">';imgRes.forEach((it,i)=>{h+='<div class="img-c"><img src="'+it.url+'" /><div class="img-l" onclick="dlOne('+i+')">Page '+it.pn+'</div></div>'});
  h+='</div>';const o=document.querySelector('.img-g');if(o)o.remove();db.insertAdjacentHTML('afterend',h);
  document.getElementById('outName').placeholder='pdf-page';
}
function dlOne(i){const it=imgRes[i];if(!it)return;const a=document.createElement('a');a.href=it.url;a.download='pdf-page-'+it.pn+'.'+it.ext;document.body.appendChild(a);a.click();a.remove()}
async function dlZip(){
  if(!files[0]){toast('No file.','r');return}
  const fd=new FormData();fd.append('file',files[0]);fd.append('format',document.getElementById('cFmt')?.value||'png');fd.append('dpi',document.getElementById('cDpi')?.value||'300');
  const pf=document.getElementById('cPf')?.value,pt=document.getElementById('cPt')?.value;if(pf)fd.append('page_from',pf);if(pt)fd.append('page_to',pt);
  try{const r=await fetch(API+'/pdf-to-image-zip',{method:'POST',body:fd});if(!r.ok)throw Error('ZIP failed');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(files[0].name.replace(/\.[^.]+$/,'')||'pdf')+'-images.zip';document.body.appendChild(a);a.click();a.remove();toast('ZIP downloaded.')}catch(e){toast(e.message||'ZIP failed','r')}
}

/* ── TOAST ── */
function toast(msg,t){
  const w=document.getElementById('tst'),e=document.createElement('div');
  e.className='t '+(t||'g')+' show';e.textContent=msg;w.appendChild(e);
  setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),250)},3500);
}

/* ── THEME ── */
function applyTheme(th){
  document.documentElement.setAttribute('data-theme',th);
  const ic=document.getElementById('navThemeIcon'),lb=document.getElementById('navThemeLabel');
  if(th==='dark'){ic.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';lb.textContent='Light'}
  else{ic.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';lb.textContent='Dark'}
  localStorage.setItem('pfTheme',th);
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}

function fs(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

/* ── INIT ── */
render();
const st=localStorage.getItem('pfTheme');applyTheme(st||'light');
</script>
</body>
